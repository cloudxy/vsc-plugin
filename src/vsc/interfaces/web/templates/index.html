<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSC · 项目资源</title><link rel="stylesheet" href="/static/panel.css"><script type="module" src="/static/panel.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="/">VSC <span>项目资源</span></a><div class="session"><span id="session-label">只读浏览</span><button id="session-open">操作会话</button></div></header>
<div id="notice" role="status" hidden></div>
<main class="layout">
  <aside class="sidebar"><label class="field">当前项目<select id="projects"><option>正在读取项目…</option></select></label><div id="project-meta"></div><h2>结构导航</h2><button id="all-objects" class="tree-all">全部项目内容</button><nav id="tree" aria-label="部、集、场、镜组、镜头" aria-describedby="tree-help"></nav><p id="tree-help" class="hint">点击箭头逐层展开或收拢，点击名称筛选内容。层级来自已登记关系；未登记文件独立展示。</p></aside>
  <section class="workspace"><div class="workspace-heading"><div><p class="eyebrow">创作工作区</p><h1 id="heading">项目资源</h1><p id="scope-label" class="hint"></p></div><button id="refresh">刷新</button></div>
    <div class="tabs" role="tablist"><button role="tab" id="tab-media" aria-selected="true">素材</button><button role="tab" id="tab-artifacts" aria-selected="false">文案与版本</button><button id="upload-open" disabled>登记素材</button><button id="compare-open">比较候选 <span id="compare-count">0</span></button></div>
    <section id="media-view"><form id="filters" class="filters"><input type="search" id="query" placeholder="搜索名称或素材编号" aria-label="搜索素材"><select id="modality" aria-label="素材格式"><option value="">全部格式</option><option value="image">图片</option><option value="video">视频</option><option value="audio">音频</option><option value="text">文本</option><option value="document">文档</option></select><select id="registration" aria-label="登记状态"><option value="">全部登记状态</option><option value="registered">已登记</option><option value="unregistered">未登记</option></select><select id="role" aria-label="素材用途"><option value="">全部用途</option><option value="identity_face">人物正脸</option><option value="location_master">场景母版</option><option value="location_view">场景视角</option><option value="first_frame">镜头首帧</option><option value="video_take">视频候选</option><option value="dialogue_dry">对白干声</option><option value="voice_sample">声音参考</option><option value="ambience">环境声</option><option value="music">配乐</option><option value="sfx">音效</option></select><select id="status" aria-label="用途选择状态"><option value="">全部选择状态</option><option value="selected">已有当前选择</option><option value="unselected">尚未获选</option><option value="deprecated">已停用素材</option><option value="active">未标记停用</option></select><button type="submit">筛选</button></form><div id="resource-summary" class="hint"></div><div id="resources" class="resource-grid"></div><div class="pagination"><button id="previous">上一页</button><span id="page-info"></span><button id="next">下一页</button></div></section>
    <section id="artifact-view" hidden><div class="documents"><div id="artifacts" class="artifact-list"></div><article id="document" class="reader"><p class="empty">选择文案或固定版本阅读。</p></article></div></section>
  </section>
</main>
<dialog id="media-dialog"><div class="dialog-header"><h2 id="media-title">素材详情</h2><button class="close-dialog" aria-label="关闭">关闭</button></div><div id="media-detail"></div></dialog>
<dialog id="compare-dialog"><div class="dialog-header"><h2>候选比较</h2><button class="close-dialog">关闭</button></div><div id="compare-grid" class="compare-grid"></div><p class="hint">比较只记录当前浏览选择；正式用途选择须通过审查操作明确确认。</p></dialog>
<dialog id="session-dialog"><div class="dialog-header"><h2>本机人工操作会话</h2><button class="close-dialog">关闭</button></div><p class="hint">使用启动终端提供的本次凭据。操作人由启动配置确定，旧项目保持只读。</p><form id="session-form"><label class="field">本次凭据<input type="password" id="session-token" autocomplete="off" required></label><button type="submit">建立会话</button></form></dialog>
<dialog id="upload-dialog"><div class="dialog-header"><h2>登记受控素材</h2><button class="close-dialog">关闭</button></div><p class="hint">原文件转存到受控媒体库，登记来源与权利。登记完成后再为具体用途提出候选，不自动批准。</p><form id="upload-form" class="review-form"><label class="field">原文件<input id="upload-file" type="file" required></label><label class="field">来源及证据说明<textarea id="upload-source" placeholder="谁提供或制作、授权依据、原始出处" required></textarea></label><label class="field">权利状态<select id="upload-rights"><option value="unknown">未知（仅登记草稿）</option><option value="owned">本人／项目自有</option><option value="licensed">已取得授权</option></select></label><label class="field">适用用途<input id="upload-scope" placeholder="用途代码，以逗号分隔；明确全用途可填 *"></label><button type="submit">上传并登记</button></form></dialog>
</body></html>
