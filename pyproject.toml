[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vsc-workflow"
version = "0.22.0"
description = "Provider-neutral short drama workflow and resource panel"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web = ["fastapi==0.128.8", "uvicorn==0.39.0"]
postgres = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1,<4", "alembic>=1.13,<2"]
storage = ["boto3>=1.34,<2"]
media = ["Pillow==11.3.0"]
test = ["httpx==0.28.1"]

[project.scripts]
vsc = "vsc.project.state:main"
vsc-panel = "vsc.interfaces.web.__main__:main"
vsc-resources = "vsc.interfaces.cli.resources:main"
vsc-schema = "vsc.project.schema_review:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["vsc", "vsc.*", "tools", "tools.maintenance", "tools.maintenance.*"]
namespaces = false

[tool.setuptools.package-data]
"vsc" = ["module-map.json"]
"vsc.interfaces.web" = ["templates/*", "static/*"]

[tool.setuptools.data-files]
"share/vsc-workflow/workflow" = ["workflow/README.md", "workflow/contracts.json", "workflow/hosts.json", "workflow/kernel.json", "workflow/library.json", "workflow/production-v2.md", "workflow/roles.json"]
